name: Build Resort Hole 1 v0.8
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Install Wii development libraries
        run: |
          dkp-pacman -Syy --noconfirm
          dkp-pacman -S --needed --noconfirm wii-dev
      - name: Prepare source layout
        run: |
          rm -rf source
          mkdir -p source
          cp main.c source/main.c
      - name: Build Wii executable
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITPPC=/opt/devkitpro/devkitPPC
          make clean || true
          make
      - name: Package SD card app
        run: |
          DOL="$(find . -type f -name '*.dol' | head -n 1)"
          test -n "$DOL"
          mkdir -p SD_CARD/apps/resort_hole1
          cp "$DOL" SD_CARD/apps/resort_hole1/boot.dol
          cp meta.xml SD_CARD/apps/resort_hole1/meta.xml
          cp icon.png SD_CARD/apps/resort_hole1/icon.png
          sha256sum SD_CARD/apps/resort_hole1/boot.dol > SD_CARD/apps/resort_hole1/boot.dol.sha256
          cd SD_CARD && zip -r ../resort_hole1_v0_8_SD_CARD.zip .
      - name: Upload playable build
        uses: actions/upload-artifact@v4
        with:
          name: resort-hole1-v0-8
          path: resort_hole1_v0_8_SD_CARD.zip
