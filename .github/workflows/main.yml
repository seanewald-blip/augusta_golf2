name: Build Augusta Golf for Wii-vWii

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitppc:latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Wii development libraries
        run: |
          dkp-pacman -Syy --noconfirm
          dkp-pacman -S --needed --noconfirm wii-dev

      - name: Diagnose libogc paths
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITPPC=$DEVKITPPC"
          echo "Looking for gccore.h..."
          find /opt/devkitpro -name gccore.h -print
          echo "Checking expected locations..."
          ls -la /opt/devkitpro/libogc/include/gccore.h || true
          ls -la /opt/devkitpro/devkitPPC/wii_rules || true

      - name: Prepare source layout
        run: |
          rm -rf source
          mkdir -p source
          cp main.c source/main.c
          cp course.c source/course.c
          cp course.h source/course.h

      - name: Build Wii executable
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITPPC=/opt/devkitpro/devkitPPC
          echo "Starting Wii build..."
          make clean || true
          make

      - name: Find and package compiled DOL
        run: |
          echo "Searching for compiled Wii executable..."
          find . -type f \( -name "*.dol" -o -name "*.elf" \) -print

          DOL="$(find . -type f -name "*.dol" | head -n 1)"

          if [ -z "$DOL" ]; then
            echo "ERROR: No DOL file was generated."
            exit 1
          fi

          echo "Found: $DOL"

          mkdir -p SD_CARD/apps/augusta_golf/data

          cp "$DOL" SD_CARD/apps/augusta_golf/boot.dol
          cp meta.xml SD_CARD/apps/augusta_golf/meta.xml
          cp icon.png SD_CARD/apps/augusta_golf/icon.png
          cp course_2026.csv SD_CARD/apps/augusta_golf/data/course_2026.csv

          sha256sum SD_CARD/apps/augusta_golf/boot.dol \
            > SD_CARD/apps/augusta_golf/boot.dol.sha256

      - name: Create SD-card ZIP
        run: |
          cd SD_CARD
          zip -r ../augusta_golf_SD_CARD.zip .

      - name: Upload playable SD package
        uses: actions/upload-artifact@v4
        with:
          name: augusta-golf-vwii-sd-ready
          path: augusta_golf_SD_CARD.zip
