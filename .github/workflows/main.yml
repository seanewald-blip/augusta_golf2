name: Build Augusta Golf for Wii-vWii

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitppc:latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Wii development libraries
        run: |
          dkp-pacman -Syy --noconfirm
          dkp-pacman -S --needed --noconfirm wii-dev

      - name: Verify Wii toolchain
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITPPC=$DEVKITPPC"
          test -f /opt/devkitpro/libogc/include/gccore.h
          test -f /opt/devkitpro/devkitPPC/wii_rules
          ls -l /opt/devkitpro/libogc/include/gccore.h

      - name: Prepare source layout
        run: |
          rm -rf source
          mkdir -p source
          cp main.c source/main.c
          cp course.c source/course.c
          cp course.h source/course.h

      - name: Build Wii executable
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITPPC=/opt/devkitpro/devkitPPC
          make clean || true
          make

      - name: Find and package compiled DOL
        run: |
          DOL="$(find . -type f -name "*.dol" | head -n 1)"

          if [ -z "$DOL" ]; then
            echo "ERROR: No .dol file generated"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Found Wii executable: $DOL"

          mkdir -p SD_CARD/apps/augusta_golf/data

          cp "$DOL" \
            SD_CARD/apps/augusta_golf/boot.dol

          cp meta.xml \
            SD_CARD/apps/augusta_golf/meta.xml

          cp icon.png \
            SD_CARD/apps/augusta_golf/icon.png

          cp course_2026.csv \
            SD_CARD/apps/augusta_golf/data/course_2026.csv

          sha256sum SD_CARD/apps/augusta_golf/boot.dol \
            > SD_CARD/apps/augusta_golf/boot.dol.sha256

      - name: Create SD-card ZIP
        run: |
          cd SD_CARD
          zip -r ../augusta_golf_SD_CARD.zip .

      - name: Upload playable SD package
        uses: actions/upload-artifact@v4
        with:
          name: augusta-golf-vwii-sd-ready
          path: augusta_golf_SD_CARD.zip
