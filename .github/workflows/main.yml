name: Build Resort-Feel Golf Lab v0.7

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Install Wii development libraries
        run: |
          dkp-pacman -Syy --noconfirm
          dkp-pacman -S --needed --noconfirm wii-dev
      - name: Prepare source layout
        run: |
          rm -rf source
          mkdir -p source
          cp main.c source/main.c
      - name: Build Wii executable
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITPPC=/opt/devkitpro/devkitPPC
          make clean || true
          make
      - name: Package v0.7
        run: |
          DOL="$(find . -type f -name "*.dol" | head -n 1)"
          if [ -z "$DOL" ]; then
            echo "ERROR: No .dol file generated"
            exit 1
          fi
          mkdir -p SD_CARD/apps/resort_golf_lab
          cp "$DOL" SD_CARD/apps/resort_golf_lab/boot.dol
          cp meta.xml SD_CARD/apps/resort_golf_lab/meta.xml
          cp icon.png SD_CARD/apps/resort_golf_lab/icon.png
          sha256sum SD_CARD/apps/resort_golf_lab/boot.dol > SD_CARD/apps/resort_golf_lab/boot.dol.sha256
          cd SD_CARD
          zip -r ../resort_golf_lab_v0_7_SD_CARD.zip .
      - name: Upload playable v0.7
        uses: actions/upload-artifact@v4
        with:
          name: resort-golf-lab-v0-7
          path: resort_golf_lab_v0_7_SD_CARD.zip
