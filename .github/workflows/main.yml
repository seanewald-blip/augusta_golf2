name: Build Augusta Golf for Wii-vWii

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitppc:latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Verify Wii toolchain
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITPPC=$DEVKITPPC"
          ls -la /opt/devkitpro/libogc/include/gccore.h
          ls -la /opt/devkitpro/devkitPPC/wii_rules

      - name: Prepare source layout
        run: |
          rm -rf source
          mkdir -p source
          cp main.c source/main.c
          cp course.c source/course.c
          cp course.h source/course.h

      - name: Build Wii executable
        run: |
          make clean || true
          make

      - name: Find compiled DOL
        run: |
          echo "Compiled files:"
          find . -maxdepth 3 -type f \( -name "*.dol" -o -name "*.elf" \) -print

          DOL="$(find . -maxdepth 3 -type f -name "*.dol" | head -n 1)"

          if [ -z "$DOL" ]; then
            echo "ERROR: No .dol file was generated"
            exit 1
          fi

          mkdir -p SD_CARD/apps/augusta_golf/data
          cp "$DOL" SD_CARD/apps/augusta_golf/boot.dol
          cp meta.xml SD_CARD/apps/augusta_golf/meta.xml
          cp icon.png SD_CARD/apps/augusta_golf/icon.png
          cp course_2026.csv SD_CARD/apps/augusta_golf/data/course_2026.csv

          sha256sum SD_CARD/apps/augusta_golf/boot.dol \
            > SD_CARD/apps/augusta_golf/boot.dol.sha256

      - name: Package SD card
        run: |
          cd SD_CARD
          zip -r ../augusta_golf_SD_CARD.zip .

      - name: Upload playable SD package
        uses: actions/upload-artifact@v4
        with:
          name: augusta-golf-vwii-sd-ready
          path: augusta_golf_SD_CARD.zip
